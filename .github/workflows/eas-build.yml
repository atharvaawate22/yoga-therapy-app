name: EAS Build (Android APK)

on:
  push:
    branches: [main]
    # Each EAS build spends free-tier quota, so skip pushes that can't change
    # the APK: backend code (deployed by its own workflow), the web app and
    # its shared packages (not part of the Expo bundle), docs, and CI files
    # other than this one.
    paths-ignore:
      - "backend/**"
      - "web/**"
      - "packages/**" # remove once the RN app imports pose-core (plan M8)
      - "**/*.md"
      - ".github/workflows/deploy-lambda-backend.yml"
      - ".github/workflows/publish-latest-apk.yml"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/app-tests.yml"
      - ".github/workflows/web-ci.yml"
      - "**/__tests__/**"
      - "jest.setup.js"
  workflow_dispatch: {}

permissions:
  contents: write # needed to publish/update the "latest-preview" GitHub Release

# One build at a time: two overlapping runs could otherwise publish their APKs
# to the rolling release out of order. A newer push waits rather than cancels,
# since a cancelled run may already have spent an EAS build.
concurrency:
  group: eas-build-android
  cancel-in-progress: false

jobs:
  build:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK on EAS
        id: build
        env:
          EXPO_DEBUG: "1"
        # --json prints the finished build(s) on stdout (logs go to stderr),
        # so later steps use *this* build rather than "the latest one on EAS".
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          cat eas-build.json

      - name: Dump build details on failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          BUILD_ID=$(eas build:list --platform android --limit 1 --non-interactive --json | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log(data?.[0]?.id ?? '');
          ")
          echo "Build ID: $BUILD_ID"
          if [ -n "$BUILD_ID" ]; then
            eas build:view "$BUILD_ID" --json || true
          fi

      - name: Fetch APK download URL
        id: apk
        run: |
          URL=$(node -e "
            const data = JSON.parse(require('fs').readFileSync('eas-build.json', 'utf8'));
            const build = Array.isArray(data) ? data[0] : data;
            const url = build?.artifacts?.buildUrl;
            if (!url) { console.error('No build URL in eas-build.json'); process.exit(1); }
            console.log(url);
          ")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 📱 APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the APK]($URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Download APK for this workflow run
        run: curl -L -o yoga-therapy.apk "${{ steps.apk.outputs.url }}"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoga-therapy-app-preview-apk
          path: yoga-therapy.apk
          retention-days: 30

      # Publishes the same APK to a rolling "latest-preview" GitHub Release
      # (asset name yoga-therapy.apk) on every successful build. The
      # README's download button/QR code point at the permanent
      # /releases/latest/download/yoga-therapy.apk URL, which GitHub always
      # resolves to whichever non-prerelease release was published most
      # recently -- so this keeps that link (and the QR code, which never
      # needs to change since it just encodes the URL text) current without
      # any manual step.
      - name: Publish APK to the "latest preview" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-preview
          name: Latest Preview Build (auto-updated)
          body: |
            Automatically rebuilt from commit ${{ github.sha }} on every push to `main`.
            This is a preview/sideload build (not a Play Store release) -- see the
            [User Guide](https://github.com/${{ github.repository }}/blob/main/USER_GUIDE.md).
          prerelease: false
          make_latest: true
          files: yoga-therapy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
