name: Deploy Backend (AWS Lambda)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-lambda-backend.yml"
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: yoga-pose-engine
  LAMBDA_FUNCTION_NAME: yoga-pose-engine
  LAMBDA_ROLE_ARN: arn:aws:iam::968138090176:role/yoga-pose-engine-lambda-role
  # The HTTP API the app calls (src/config/poseApi.js HOSTED_API_URL).
  API_GATEWAY_ID: vb57jykmzc
  # The endpoint is public and its URL ships inside the APK, so cap request
  # rates to bound the Lambda bill. One live session sends about 1 req/s.
  THROTTLE_RATE_LIMIT: "10"
  THROTTLE_BURST_LIMIT: "20"
  LAMBDA_TIMEOUT: "30"
  LAMBDA_MEMORY_MB: "2048"

jobs:
  deploy:
    name: Build, push, and deploy Lambda container
    runs-on: ubuntu-latest
    steps:
      - name: Check for AWS credentials
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets are not set. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --no-cli-pager

      - name: Build image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -f backend/Dockerfile.lambda -t "$IMAGE_URI" backend
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # Loads the real models inside the image and runs one analysis. Unit
      # tests stub the models, so this is what catches a broken runtime
      # dependency before it reaches production.
      - name: Smoke-test image
        run: docker run --rm -i --entrypoint python "${{ steps.build.outputs.image_uri }}" - < backend/smoke_test_image.py

      - name: Push image
        run: docker push "${{ steps.build.outputs.image_uri }}"

      - name: Create or update Lambda function
        run: |
          if aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Updating existing function..."
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --image-uri "${{ steps.build.outputs.image_uri }}" \
              --no-cli-pager
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
            # update-function-code leaves settings alone; keep them matching
            # what this workflow declares.
            aws lambda update-function-configuration \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --timeout "$LAMBDA_TIMEOUT" \
              --memory-size "$LAMBDA_MEMORY_MB" \
              --no-cli-pager >/dev/null
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
          else
            echo "Creating new function..."
            aws lambda create-function \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --package-type Image \
              --code ImageUri="${{ steps.build.outputs.image_uri }}" \
              --role "$LAMBDA_ROLE_ARN" \
              --timeout "$LAMBDA_TIMEOUT" \
              --memory-size "$LAMBDA_MEMORY_MB" \
              --no-cli-pager
            aws lambda wait function-active --function-name "$LAMBDA_FUNCTION_NAME"
          fi

      - name: Apply API Gateway throttling
        run: |
          STAGES=$(aws apigatewayv2 get-stages --api-id "$API_GATEWAY_ID" --query 'Items[].StageName' --output text)
          for STAGE in $STAGES; do
            aws apigatewayv2 update-stage \
              --api-id "$API_GATEWAY_ID" \
              --stage-name "$STAGE" \
              --default-route-settings "ThrottlingRateLimit=$THROTTLE_RATE_LIMIT,ThrottlingBurstLimit=$THROTTLE_BURST_LIMIT" \
              --no-cli-pager >/dev/null
            echo "Throttled stage '$STAGE': rate=$THROTTLE_RATE_LIMIT/s burst=$THROTTLE_BURST_LIMIT"
          done

      # The app calls API Gateway, not a Lambda Function URL (this account
      # blocks anonymous Function URL invocation; see src/config/poseApi.js).
      - name: Summary
        run: |
          echo "### Lambda backend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ steps.build.outputs.image_uri }}" >> "$GITHUB_STEP_SUMMARY"
          echo "API: https://$API_GATEWAY_ID.execute-api.$AWS_REGION.amazonaws.com" >> "$GITHUB_STEP_SUMMARY"
