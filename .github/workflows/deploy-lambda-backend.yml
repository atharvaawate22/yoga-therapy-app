name: Deploy Backend (AWS Lambda)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-lambda-backend.yml"
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: yoga-pose-engine
  LAMBDA_FUNCTION_NAME: yoga-pose-engine
  LAMBDA_ROLE_ARN: arn:aws:iam::968138090176:role/yoga-pose-engine-lambda-role
  # The HTTP API the app calls (src/config/poseApi.js HOSTED_API_URL).
  API_GATEWAY_ID: vb57jykmzc
  # The endpoint is public and its URL ships inside the APK, so cap request
  # rates to bound the Lambda bill. One live session sends about 1 req/s.
  THROTTLE_RATE_LIMIT: "10"
  THROTTLE_BURST_LIMIT: "20"
  LAMBDA_TIMEOUT: "30"
  LAMBDA_MEMORY_MB: "2048"

jobs:
  deploy:
    name: Build, push, and deploy Lambda container
    runs-on: ubuntu-latest
    steps:
      - name: Check for AWS credentials
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets are not set. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --no-cli-pager

      # Every deploy pushes a new image tagged with the commit SHA, so old
      # images pile up and are billed as ECR storage. Keep only the newest
      # few: the image Lambda runs is always the newest, and two more allow
      # a rollback. ECR applies the policy asynchronously (within ~24h).
      - name: Apply ECR lifecycle policy
        run: |
          aws ecr put-lifecycle-policy \
            --repository-name "$ECR_REPOSITORY" \
            --lifecycle-policy-text '{"rules":[{"rulePriority":1,"description":"Keep only the 3 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":3},"action":{"type":"expire"}}]}' \
            --no-cli-pager >/dev/null

      - name: Build image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          # Lambda accepts only a single-platform image manifest. Newer
          # Docker adds provenance/SBOM attestations by default, which pushes
          # a multi-manifest index that Lambda rejects ("image manifest ...
          # media type ... is not supported", Nov 2026). Build without them.
          docker build --provenance=false --sbom=false --platform linux/amd64 \
            -f backend/Dockerfile.lambda -t "$IMAGE_URI" backend
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # Loads the real models inside the image and runs one analysis. Unit
      # tests stub the models, so this is what catches a broken runtime
      # dependency before it reaches production.
      - name: Smoke-test image
        run: docker run --rm -i --entrypoint python "${{ steps.build.outputs.image_uri }}" - < backend/smoke_test_image.py

      - name: Push image
        run: docker push "${{ steps.build.outputs.image_uri }}"

      - name: Create or update Lambda function
        run: |
          if aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Updating existing function..."
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --image-uri "${{ steps.build.outputs.image_uri }}" \
              --no-cli-pager
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
            # update-function-code leaves settings alone; keep them matching
            # what this workflow declares.
            aws lambda update-function-configuration \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --timeout "$LAMBDA_TIMEOUT" \
              --memory-size "$LAMBDA_MEMORY_MB" \
              --no-cli-pager >/dev/null
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
          else
            echo "Creating new function..."
            aws lambda create-function \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --package-type Image \
              --code ImageUri="${{ steps.build.outputs.image_uri }}" \
              --role "$LAMBDA_ROLE_ARN" \
              --timeout "$LAMBDA_TIMEOUT" \
              --memory-size "$LAMBDA_MEMORY_MB" \
              --no-cli-pager
            aws lambda wait function-active --function-name "$LAMBDA_FUNCTION_NAME"
          fi

      # The route, integration and stage were first set up by hand, so nothing
      # restored them when they went missing (every path returned API
      # Gateway's own 404, Nov 2026). Recreate whatever is missing on every
      # deploy. Each call is skipped when the piece already exists.
      - name: Ensure API Gateway routes to the function
        run: |
          ROUTE_KEY='$default'
          STAGE_NAME='$default'
          FUNCTION_ARN=$(aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME" \
            --query 'Configuration.FunctionArn' --output text)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # 1. Lambda proxy integration pointing at the function.
          INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "$API_GATEWAY_ID" \
            --query "Items[?IntegrationType=='AWS_PROXY' && contains(IntegrationUri, '$LAMBDA_FUNCTION_NAME')].IntegrationId | [0]" \
            --output text)
          if [ -z "$INTEGRATION_ID" ] || [ "$INTEGRATION_ID" = "None" ]; then
            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id "$API_GATEWAY_ID" \
              --integration-type AWS_PROXY \
              --integration-uri "$FUNCTION_ARN" \
              --payload-format-version 2.0 \
              --timeout-in-millis 30000 \
              --query IntegrationId --output text)
            echo "Created integration $INTEGRATION_ID"
          else
            echo "Integration $INTEGRATION_ID exists"
          fi
          TARGET="integrations/$INTEGRATION_ID"

          # 2. Catch-all route ($default) sending every path to that integration.
          ROUTE=$(aws apigatewayv2 get-routes --api-id "$API_GATEWAY_ID" \
            --query "Items[?RouteKey=='$ROUTE_KEY'] | [0].[RouteId,Target]" --output text)
          ROUTE_ID=$(echo "$ROUTE" | cut -f1)
          ROUTE_TARGET=$(echo "$ROUTE" | cut -f2)
          if [ -z "$ROUTE_ID" ] || [ "$ROUTE_ID" = "None" ]; then
            aws apigatewayv2 create-route --api-id "$API_GATEWAY_ID" \
              --route-key "$ROUTE_KEY" --target "$TARGET" --no-cli-pager >/dev/null
            echo "Created route $ROUTE_KEY -> $TARGET"
          elif [ "$ROUTE_TARGET" != "$TARGET" ]; then
            aws apigatewayv2 update-route --api-id "$API_GATEWAY_ID" \
              --route-id "$ROUTE_ID" --target "$TARGET" --no-cli-pager >/dev/null
            echo "Pointed route $ROUTE_KEY at $TARGET (was '$ROUTE_TARGET')"
          else
            echo "Route $ROUTE_KEY -> $TARGET exists"
          fi

          # 3. Auto-deploying $default stage, so the URL has no stage prefix.
          if aws apigatewayv2 get-stage --api-id "$API_GATEWAY_ID" --stage-name "$STAGE_NAME" >/dev/null 2>&1; then
            aws apigatewayv2 update-stage --api-id "$API_GATEWAY_ID" \
              --stage-name "$STAGE_NAME" --auto-deploy --no-cli-pager >/dev/null
            echo "Stage $STAGE_NAME exists (auto-deploy on)"
          else
            aws apigatewayv2 create-stage --api-id "$API_GATEWAY_ID" \
              --stage-name "$STAGE_NAME" --auto-deploy --no-cli-pager >/dev/null
            echo "Created stage $STAGE_NAME"
          fi

          # 4. Let this API invoke the function. A conflict means it already can.
          OUT=$(aws lambda add-permission \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --statement-id "apigateway-$API_GATEWAY_ID" \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:$AWS_REGION:$ACCOUNT_ID:$API_GATEWAY_ID/*" \
            --no-cli-pager 2>&1) && echo "Granted API Gateway invoke permission" || {
              echo "$OUT" | grep -q ResourceConflictException \
                && echo "Invoke permission exists" \
                || { echo "$OUT"; exit 1; }
            }

      - name: Apply API Gateway throttling
        run: |
          STAGES=$(aws apigatewayv2 get-stages --api-id "$API_GATEWAY_ID" --query 'Items[].StageName' --output text)
          for STAGE in $STAGES; do
            aws apigatewayv2 update-stage \
              --api-id "$API_GATEWAY_ID" \
              --stage-name "$STAGE" \
              --default-route-settings "ThrottlingRateLimit=$THROTTLE_RATE_LIMIT,ThrottlingBurstLimit=$THROTTLE_BURST_LIMIT" \
              --no-cli-pager >/dev/null
            echo "Throttled stage '$STAGE': rate=$THROTTLE_RATE_LIMIT/s burst=$THROTTLE_BURST_LIMIT"
          done

      # Fails the deploy if the public URL doesn't reach the app, instead of
      # reporting success while every request 404s. Retries cover cold starts.
      - name: Check the public API
        run: |
          URL="https://$API_GATEWAY_ID.execute-api.$AWS_REGION.amazonaws.com/health"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o body.txt -w '%{http_code}' -m 35 "$URL" || true)
            echo "Attempt $i: HTTP $CODE $(head -c 200 body.txt 2>/dev/null)"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$URL did not return 200 after deploy"
          exit 1

      # The app calls API Gateway, not a Lambda Function URL (this account
      # blocks anonymous Function URL invocation; see src/config/poseApi.js).
      - name: Summary
        run: |
          echo "### Lambda backend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ steps.build.outputs.image_uri }}" >> "$GITHUB_STEP_SUMMARY"
          echo "API: https://$API_GATEWAY_ID.execute-api.$AWS_REGION.amazonaws.com" >> "$GITHUB_STEP_SUMMARY"
