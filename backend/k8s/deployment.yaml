apiVersion: apps/v1
kind: Deployment
metadata:
  name: yoga-pose-engine
  labels:
    app.kubernetes.io/name: yoga-pose-engine
    app.kubernetes.io/component: inference-api
spec:
  # Single replica: each pod holds its own copy of MoveNet plus the classifier
  # in memory, and the live-mode stability filter keeps per-session vote history
  # in process. Scaling out would need either sticky sessions or that history
  # moved to a shared store (see k8s/README.md).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yoga-pose-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yoga-pose-engine
        app.kubernetes.io/component: inference-api
    spec:
      containers:
        - name: api
          # Built locally for Minikube:
          #   eval $(minikube docker-env)
          #   docker build -t yoga-pose-engine:local backend/
          # IfNotPresent stops the kubelet trying to pull it from a registry.
          image: yoga-pose-engine:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7860 # matches EXPOSE/CMD in the Dockerfile
          env:
            - name: LOG_LEVEL
              value: INFO
            # Keep TensorFlow from spawning a thread per core and then being
            # throttled by the CPU limit below.
            - name: OMP_NUM_THREADS
              value: "2"
            - name: TF_CPP_MIN_LOG_LEVEL
              value: "2"
          resources:
            # TensorFlow's own footprint dominates; the models are ~9 MB.
            # Measured headroom, not a guess at peak — tune with `kubectl top`.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          # Importing TensorFlow and allocating the TFLite interpreter is slow
          # and highly variable on a laptop. The startup probe absorbs that so
          # a cold boot is never mistaken for a hung process: up to 30 x 5s.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # runAsNonRoot is intentionally omitted: the image has no USER
            # directive, so enforcing it here would fail the pod. Add a
            # non-root USER to the Dockerfile first, then turn this on.
      terminationGracePeriodSeconds: 30
